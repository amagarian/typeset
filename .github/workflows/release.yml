# GitHub-Actions release pipeline.
#
# Wraps the existing `scripts/release.sh` so the same script is the
# single source of truth whether you run it locally or here. The
# workflow's job is to reconstruct the secrets/cert state that
# release.sh expects on a fresh macOS runner:
#
#   * `TYPESET_GEMINI_API_KEY` — env (read at compile time by Rust).
#   * `TAURI_SIGNING_PRIVATE_KEY` — env (read by `tauri signer sign`).
#   * Developer ID Application certificate — imported into a temporary
#     keychain so `codesign` can find an identity. Identity name is
#     passed in via `TYPESET_APPLE_SIGNING_IDENTITY`.
#   * `gh` CLI — pre-installed on macOS runners and auto-authed via
#     the workflow's `GITHUB_TOKEN`, so `gh release create` works.
#
# Triggers:
#   * `push: tags: ['v*']` — push a tag, get a release. Local flow:
#       git tag v0.6.5 && git push --tags
#   * `workflow_dispatch` — manual trigger from the Actions tab (or
#     `gh workflow run release.yml -f version=0.6.5`). Bumps the
#     version files for you, commits, tags, and proceeds.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (without the leading v, e.g. 0.6.5)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version files (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<PY
          import json, pathlib, sys
          v = "${NEW_VERSION}"
          for p in ["package.json", "src-tauri/tauri.conf.json"]:
              path = pathlib.Path(p)
              data = json.loads(path.read_text())
              data["version"] = v
              path.write_text(json.dumps(data, indent=2) + "\n")
          PY
          npm install --package-lock-only --silent
          git add package.json package-lock.json src-tauri/tauri.conf.json
          git commit -m "v${NEW_VERSION}: release"
          git tag "v${NEW_VERSION}"
          git push origin HEAD
          git push origin "v${NEW_VERSION}"

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          CONF_VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          if [ "$VERSION" != "$CONF_VERSION" ]; then
            echo "Tag version v${VERSION} does not match tauri.conf.json (${CONF_VERSION})." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ runner.os }}-release-${{ steps.version.outputs.version }}

      - name: Install npm dependencies
        run: npm ci

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.RELEASE_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/typeset.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/typeset-build.keychain-db"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | xargs)
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -p codesigning -v "$KEYCHAIN_PATH"

      - name: Run release script
        env:
          TYPESET_GEMINI_API_KEY: ${{ secrets.TYPESET_GEMINI_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          TYPESET_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.tauri"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$HOME/.tauri/typeset.key"
          chmod 600 "$HOME/.tauri/typeset.key"
          bash scripts/release.sh
