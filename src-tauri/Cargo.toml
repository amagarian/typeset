[package]
name = "typeset"
version = "0.6.1"
description = "Film production PDF autofill powered by Gemini with local template caching"
authors = ["Aiden Magarian"]
edition = "2021"

[lib]
name = "typeset_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
tauri-plugin-notification = "2.3.3"

# v0.5.35 — magic-link auth callbacks. Supabase emails the user a link
# of the form `typeset://auth/callback?token_hash=…&type=magiclink`,
# the OS hands it to the running app via this plugin, and we forward
# the URL to the React layer as a Tauri event.
tauri-plugin-deep-link = "2"

# Google Gemini integration. We talk to the public Generative Language
# API directly (no Vertex SDK) so the only third-party deps are an HTTP
# client (reqwest), the keychain wrapper for the API key, base64 for
# inline-PDF payloads, and futures-util for SSE stream consumption.
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
thiserror = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# v0.5.28 — encrypted local project persistence (see `projects.rs`).
# AES-256-GCM blob on disk, key in the OS keychain (reusing the
# `keyring` entry above). `rand` is needed for the per-write
# nonce + the one-time key generation; `aes-gcm` provides the AEAD.
aes-gcm = "0.10"
rand = "0.8"
dirs = "6"
